<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHEFDASH - Autentificare Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark: #0c0c0c;
            --gold: #b48e5c;
            --white: #ffffff;
            --grey: #f4f4f4;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--dark);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            padding: 50px 40px;
            border-radius: 15px;
            border: 1px solid rgba(180, 142, 92, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .logo {
            font-family: 'Playfair Display', serif;
            color: var(--gold);
            font-size: 32px;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 40px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Selector Tip Cont */
        .type-selector {
            display: flex;
            background: rgba(0,0,0,0.3);
            padding: 5px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .type-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: none;
            color: #888;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: 0.3s;
            border-radius: 6px;
        }

        .type-btn.active {
            background: var(--gold);
            color: var(--dark);
        }

        /* Formular */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            color: var(--gold);
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--gold);
            background: rgba(255,255,255,0.1);
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: var(--gold);
            color: var(--dark);
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(180, 142, 92, 0.4);
        }

        .footer-links {
            margin-top: 25px;
            font-size: 13px;
        }

        .footer-links a {
            color: #666;
            text-decoration: none;
            transition: 0.3s;
        }

        .footer-links a:hover {
            color: var(--gold);
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo">CHEFDASH</div>
        <div class="subtitle">Management de Excelență</div>

        <div class="type-selector">
            <button id="chefBtn" class="type-btn active" onclick="setType('chef')">CHEF</button>
            <button id="resBtn" class="type-btn" onclick="setType('restaurant')">RESTAURANT</button>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email sau Utilizator</label>
                <input type="text" id="username" placeholder="introdu adresa de email" required>
            </div>
            
            <div class="form-group">
                <label>Parolă</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="login-btn">INTRARE ÎN PANOU</button>
        </form>

        <div class="footer-links">
            <a href="#">Ai uitat parola?</a> &nbsp; | &nbsp; <a href="#">Creează cont nou</a>
        </div>
    </div>

    <script>
        let currentType = 'chef';

        function setType(type) {
            currentType = type;
            
            // Actualizare vizuală butoane
            document.getElementById('chefBtn').classList.remove('active');
            document.getElementById('resBtn').classList.remove('active');
            
            if(type === 'chef') {
                document.getElementById('chefBtn').classList.add('active');
            } else {
                document.getElementById('resBtn').classList.add('active');
            }
        }

        function handleLogin(event) {
            event.preventDefault(); // Previne reîncărcarea paginii
            
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            // Simulare logare - în realitate aici verifici cu o bază de date
            if(user && pass) {
                console.log(`Logare ca ${currentType}...`);
                
                // Redirecționare în funcție de tip
                if(currentType === 'chef') {
                    window.location.href = 'dashboard_chef_final.html';
                } else {
                    window.location.href = 'dashboard_restaurant.html';
                }
            }
        }
    </script>

</body>
</html>
